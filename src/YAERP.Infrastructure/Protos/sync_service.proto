syntax = "proto3";

option csharp_namespace = "YAERP.Infrastructure.Sync.Protos";

package yaerp.sync;

service CloudSyncService {
  rpc SyncBatch (SyncBatchRequest) returns (SyncBatchResponse);
  rpc HealthCheck (HealthRequest) returns (HealthResponse);
}

message SyncItemMessage {
  string sync_id = 1;
  string entity_name = 2;
  string entity_id = 3;
  string operation_type = 4;
  string payload_json = 5;
  int64 created_at_unix = 6;
}

message SyncBatchRequest {
  string branch_id = 1;
  repeated SyncItemMessage items = 2;
}

message SyncBatchResponse {
  bool success = 1;
  repeated string synced_ids = 2;
  string error_message = 3;
}

message HealthRequest { 
  string branch_id = 1; 
}

message HealthResponse { 
  bool is_online = 1; 
  string server_version = 2; 
}
